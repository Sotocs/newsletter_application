{% extends "base.html" %}

{% block title %}
    Ошибка подтверждения
{% endblock %}

{% block content %}

<div class="alert alert-danger">
    <h4 class="alert-heading">
        Не удалось подтвердить email
    </h4>

    <p>
        Ссылка недействительна или срок её действия истёк.
    </p>

    <a
        href="{% url 'register' %}"
        class="btn btn-primary"
    >
        Зарегистрироваться снова
    </a>
</div>

{% endblock %}
