{% extends "base.html" %}

{% block title %}
    Письмо отправлено
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="alert alert-success">

            <h1 class="alert-heading">
                Проверьте почту
            </h1>

            <p>
                Если пользователь с указанным email существует,
                мы отправили на него инструкцию по восстановлению пароля.
            </p>

            <hr>

            <a
                href="{% url 'login' %}"
                class="btn btn-primary"
            >
                Вернуться ко входу
            </a>

        </div>

    </div>
</div>

{% endblock %}
