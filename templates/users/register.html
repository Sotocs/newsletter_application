{% extends "base.html" %}

{% block title %}
    Регистрация
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card">
            <div class="card-body">

                <h1 class="card-title mb-4">
                    Регистрация
                </h1>

                <form method="post">
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-3">
                            {{ field.label_tag }}
                            {{ field }}

                            {% for error in field.errors %}
                                <div class="text-danger">
                                    {{ error }}
                                </div>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Зарегистрироваться
                    </button>
                </form>

                <hr>

                <p class="mb-0">
                    Уже есть аккаунт?
                    <a href="{% url 'login' %}">
                        Войти
                    </a>
                </p>

            </div>
        </div>

    </div>
</div>

{% endblock %}
