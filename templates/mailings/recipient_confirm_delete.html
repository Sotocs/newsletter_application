{% extends "base.html" %}

{% block title %}Удаление получателя{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card shadow-sm border-danger">

            <div class="card-body p-4 text-center">

                <h1 class="h3 mb-3">
                    Удалить получателя?
                </h1>

                <p class="text-muted">
                    Вы действительно хотите удалить этого клиента?
                </p>


                <div class="bg-light rounded p-3 mb-4">

                    <div class="fw-semibold">
                        {{ recipient.full_name }}
                    </div>

                    <div class="text-muted">
                        {{ recipient.email }}
                    </div>

                </div>


                <form method="post">

                    {% csrf_token %}

                    <a
                        href="{% url 'recipient_list' %}"
                        class="btn btn-outline-secondary me-2"
                    >
                        Отмена
                    </a>

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Да, удалить
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
